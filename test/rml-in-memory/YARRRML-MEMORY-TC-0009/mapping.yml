prefixes:
  ex: "http://example.com/"
  sd: "https://w3id.org/okn/o/sd#"
  kg4di: "https://w3id.org/kg4di/"

mappings:
  json:
    sources:
      - access: $(json_data)
        referenceFormulation: JSONPath
        structureDefiner: JSON
        iterator: $
    s: ex:$(id)
    po:
      - [ex:value, $(value)]
  xml:
    sources:
      - access: $(xml_data)
        referenceFormulation: XPath
        structureDefiner: XML
        iterator: /
    s: ex:$(id)
    po:
      - [ex:value, $(value)]
